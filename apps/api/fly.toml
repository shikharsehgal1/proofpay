# fly.toml — ProofPay API
# Deploy: fly deploy -c apps/api/fly.toml --dockerfile apps/api/Dockerfile from repo root
# Or: cd apps/api && fly deploy

app = "proofpay-api"
primary_region = "ord"

[build]
  # Prefer repo-root: fly deploy -c fly.api.toml
  # From apps/api: fly deploy (dockerfile relative to this dir)
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  PORT = "8000"
  EVALUATOR_DOCKER_ENABLED = "false"
  GROK_BUILD_ENABLED = "true"
  WORKSPACES_DIR = "/data/workspaces"
  ARTIFACTS_DIR = "/data/artifacts"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[mounts]
  source = "proofpay_data"
  destination = "/data"

[[vm]]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
