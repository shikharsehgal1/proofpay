[project]
name = "proofpay-api"
version = "0.1.0"
description = "ProofPay API — verified bounties on X with Grok investigation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "psycopg2-binary>=2.9.10",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.28.0",
  "openai>=1.58.0",
  "redis>=5.2.0",
  "arq>=0.26.1",
  "cryptography>=44.0.0",
  "python-multipart>=0.0.18",
  "itsdangerous>=2.2.0",
  "orjson>=3.10.0",
  "tenacity>=9.0.0",
  "docker>=7.1.0",
  "PyJWT>=2.10.0",
  "Pillow>=11.0.0",
  "GitPython>=3.1.43",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
